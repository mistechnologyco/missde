<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missde Yapım — Reklam ve Marka Filmleri</title>
<meta name="description" content="Missde Yapım; reklam filmleri, marka filmleri, yaratıcı video prodüksiyonu ve sinematik hikâye anlatımı.">
<meta property="og:title" content="Missde Yapım">
<meta property="og:description" content="Hikâyeleri görüntüye dönüştürüyoruz.">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@800&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--bg2:#111;--surf:#1a1a1a;--fg:#f5f3ef;--mut:#b8b1a6;--line:#292929;--px:clamp(16px,4.5vw,56px);box-sizing:border-box}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:max(74px,calc(env(safe-area-inset-top,0px) + 64px));overflow-x:hidden}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100%;background:var(--bg);color:var(--fg);font:400 16px/1.6 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tag{font:500 12px 'Space Grotesk',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
h1,h2,h3{font-weight:800;line-height:1.05;letter-spacing:-.02em;text-transform:uppercase;word-break:break-word;overflow-wrap:break-word}
h1{font-size:clamp(32px,8vw,116px)}
h2{font-size:clamp(24px,5.2vw,68px)}
.wrap{padding:0 var(--px)}
.sec{padding-block:clamp(48px,8vw,128px);border-top:1px solid var(--line)}

header{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;justify-content:space-between;align-items:center;padding:16px var(--px);padding-top:max(16px,env(safe-area-inset-top,16px));transition:background .4s,border-color .4s}
header.solid{background:rgba(9,9,9,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.logo{position:relative;z-index:101;display:flex;align-items:center}
.logo img{height:32px;display:block}
nav{display:flex;gap:28px;align-items:center}
nav a{font:500 12px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase;color:var(--mut);transition:color .3s}
nav a:hover,nav a.on{color:var(--fg)}
nav a.cta{color:var(--fg);border-bottom:1px solid var(--fg);padding-bottom:3px}
#bt{display:none;position:relative;z-index:101;background:rgba(18,18,18,.8);border:1px solid var(--line);color:var(--fg);padding:10px 16px;font:500 12px 'Space Grotesk';letter-spacing:.14em;cursor:pointer;border-radius:2px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:.25s;min-height:42px}
#bt:active{background:var(--fg);color:var(--bg)}

@media(max-width:860px){
  header{padding-block:12px;padding-top:max(12px,env(safe-area-inset-top,12px))}
  .logo img{height:28px}
  #bt{display:inline-flex;align-items:center;justify-content:center}
  nav{position:fixed;inset:0;background:rgba(9,9,9,.98);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);flex-direction:column;justify-content:center;align-items:center;gap:22px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px);transition:opacity .3s ease,transform .3s ease,visibility .3s;padding:max(80px,calc(env(safe-area-inset-top,0px) + 70px)) var(--px) max(40px,env(safe-area-inset-bottom,20px));z-index:100;overflow-y:auto}
  nav.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}
  nav a{font-size:clamp(19px,5vw,26px);color:var(--fg);padding:8px 16px;min-height:44px;display:inline-flex;align-items:center;letter-spacing:.1em}
  nav a.cta{border-bottom:2px solid var(--fg);padding-bottom:6px;margin-top:10px}
}

.hero{position:relative;min-height:min(100svh,1000px);display:flex;flex-direction:column;justify-content:flex-end;padding:140px 0 56px;overflow:hidden;background:#0c0c0c}
@media(max-width:860px){
  .hero{min-height:auto;padding:max(104px,calc(env(safe-area-inset-top,0px) + 88px)) 0 clamp(44px,8vh,64px);justify-content:flex-start}
}
.hero .bg,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.beam{position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 38%,rgba(184,177,166,.2) 50%,transparent 62%),radial-gradient(60% 50% at 75% 30%,#232120,transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,-3%) scale(1.06)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#090909 5%,rgba(9,9,9,.35) 60%,rgba(9,9,9,.55))}
.hero .wrap{position:relative;z-index:2}
.hero p{max-width:480px;margin:20px 0 28px;color:var(--mut);font-size:clamp(15px,3.8vw,18px);line-height:1.6}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;font:500 12px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase;padding:15px 24px;border:1px solid var(--fg);background:none;color:var(--fg);cursor:pointer;transition:.25s;min-height:46px;text-align:center}
.btn.f,.btn:hover{background:var(--fg);color:var(--bg)}
.btn.f:hover{background:none;color:var(--fg)}
.btn:active{transform:scale(.98)}
@media(max-width:540px){.btns{flex-direction:column;width:100%;gap:12px}.btns .btn{width:100%}}
.scroll{position:absolute;right:var(--px);bottom:48px;z-index:2;writing-mode:vertical-rl}
@media(max-width:768px){.scroll{display:none}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:clamp(28px,5vw,56px)}
.head p{color:var(--mut);max-width:340px;font-size:clamp(14px,3.5vw,16px)}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(14px,2.2vw,28px)}
.card{grid-column:span 6;display:block}
.card.wide{grid-column:span 12}.card.wide .ph{aspect-ratio:21/9}.rl{grid-column:span 3}.rl .ph{aspect-ratio:9/16}.rl h3{font-size:17px}.rl .meta span:last-child{display:none}
.vid canvas{position:absolute;inset:0;width:100%;height:100%}
.vid.vr{aspect-ratio:9/16;max-width:420px;margin-inline:auto}
.vid.vr+.pl,.vid.vr+.pl+p{max-width:420px;margin-inline:auto}
#rs[hidden]{display:none}

@media(max-width:860px){
  .card,.card.wide{grid-column:span 12}
  .card.wide .ph{aspect-ratio:16/10}
  .card.rl{grid-column:span 6}
}
@media(max-width:480px){
  .card.rl h3{font-size:15px;margin:10px 0 4px}
  .card.rl .meta{font-size:11px}
  .card.rl .ph b{font-size:9px;padding:2px 6px;top:8px;left:8px;letter-spacing:.08em}
}

.ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--surf)}
.ph canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph i{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph i{transform:scale(1.05)}
.ph b{position:absolute;left:12px;top:12px;font:500 10px 'Space Grotesk';letter-spacing:.14em;border:1px solid var(--mut);color:var(--mut);padding:3px 8px;background:rgba(9,9,9,.75);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.card h3{font-size:clamp(18px,4.5vw,22px);margin:14px 0 6px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:clamp(11px,2.8vw,12px)}

.svc{display:grid;grid-template-columns:60px 1fr 1.2fr 30px;gap:20px;align-items:baseline;padding:24px 0;border-top:1px solid var(--line);transition:padding .4s}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc:hover{padding-left:12px}
.svc h3{font-size:clamp(20px,3.4vw,40px)}
.svc p{color:var(--mut);font-size:clamp(14px,3.2vw,16px)}
@media(max-width:800px){
  .svc{grid-template-columns:36px 1fr;gap:6px 12px;padding:20px 0}
  .svc p{grid-column:2}
  .svc span:last-child{display:none}
}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:clamp(32px,5vw,56px)}
.steps div{padding:24px 20px 0 0;border-top:1px solid var(--fg)}
.steps h3{font-size:clamp(18px,3.8vw,22px);margin:12px 0 8px}
.steps p{color:var(--mut);font-size:clamp(14px,3.2vw,15px)}
@media(max-width:800px){
  .steps{grid-template-columns:1fr;gap:28px}
  .steps div{padding:18px 0 0;border-top:1px solid var(--fg)}
}

.about{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(32px,5vw,56px);align-items:end}
.about p{color:var(--mut);font-size:clamp(15px,3.8vw,18px);max-width:520px;line-height:1.65}
.slot{aspect-ratio:4/5;border:1px dashed #3a3a3a;display:grid;place-items:center;text-align:center;padding:20px;background:var(--bg2)}
@media(max-width:800px){
  .about{grid-template-columns:1fr}
  .slot{aspect-ratio:16/9;min-height:180px}
}

.big-cta{text-align:left}
.big-cta h2{font-size:clamp(26px,6vw,92px);margin-bottom:20px}
.big-cta p{color:var(--mut);margin-bottom:28px;font-size:clamp(15px,3.5vw,17px)}
@media(max-width:540px){.big-cta .btn{width:100%;text-align:center}}

footer.wrap{border-top:1px solid var(--line);padding-block:clamp(48px,8vw,88px) max(36px,env(safe-area-inset-bottom,36px))}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:clamp(28px,4vw,40px)}
.fb p{color:var(--mut);margin:0 0 20px;max-width:320px;font-size:clamp(14px,3.2vw,15px)}
footer img{height:28px;margin-bottom:14px}
footer ul{list-style:none;padding:0;display:grid;gap:10px;color:var(--mut);font-size:clamp(14px,3.2vw,15px)}
footer h4{margin-bottom:14px;font-weight:500}
footer li a{display:inline-block;padding:2px 0;transition:color .2s}
footer li a:hover{color:var(--fg)}
@media(max-width:800px){.fg{grid-template-columns:1fr 1fr}.fb{grid-column:1/-1}}
@media(max-width:500px){
  .fg{grid-template-columns:1fr;gap:32px}
  .fb .btn{width:100%;text-align:center}
}

.fl{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:clamp(36px,6vw,56px);padding-top:24px;border-top:1px solid var(--line);color:#6f6a62;font-size:13px}
.fl a:hover{color:var(--fg)}
@media(max-width:540px){.fl{flex-direction:column-reverse;align-items:flex-start;gap:12px}}

.pl{display:flex;gap:16px;align-items:center;margin:-16px 0 18px;flex-wrap:nowrap}
.pl input{flex:1;accent-color:#f5f3ef;border:0;padding:0;height:6px;border-radius:3px;cursor:pointer}
.pl .tag{min-width:76px;font-size:12px}
@media(max-width:600px){
  .pl{display:flex;flex-wrap:nowrap;gap:10px;margin:12px 0 16px;align-items:center}
  .pl #pp{padding:10px 16px;font-size:11px;min-height:38px}
  .pl .tag{min-width:65px;font-size:11px;text-align:right}
}
.pv p{color:var(--mut);margin:0 0 22px;max-width:680px;font-size:clamp(15px,3.5vw,16px)}
.pv h3{font-size:clamp(18px,4.5vw,22px);margin:32px 0 10px}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:clamp(28px,5vw,40px)}
.filters button{background:none;border:1px solid var(--line);color:var(--mut);padding:9px 16px;cursor:pointer;font:500 12px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;transition:.2s;min-height:38px}
.filters button.on,.filters button:hover{border-color:var(--fg);color:var(--fg)}
.filters button:active{transform:scale(.97)}
@media(max-width:768px){
  .filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:8px;padding-bottom:6px;margin-inline:calc(-1 * var(--px));padding-inline:var(--px)}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex-shrink:0;white-space:nowrap;padding:8px 14px;font-size:11px}
}

.page{padding-top:clamp(92px,16vw,150px)}
.vid{aspect-ratio:16/9;background:var(--surf);position:relative;overflow:hidden;margin:clamp(20px,4vw,40px) 0}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.facts{display:grid;grid-template-columns:1fr 2fr;gap:clamp(24px,4vw,56px);margin-top:clamp(20px,4vw,36px)}
.facts dt{margin-top:18px}.facts dd{margin:4px 0 0;font-size:clamp(15px,3.5vw,16px)}
@media(max-width:800px){.facts{grid-template-columns:1fr;gap:8px}.facts dt{margin-top:14px}}

form{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:900px;margin-top:clamp(28px,5vw,48px)}
label{display:block}label .tag{display:block;margin-bottom:8px}
input,select,textarea{width:100%;background:none;border:0;border-bottom:1px solid #3a3a3a;color:var(--fg);padding:10px 0;font:inherit;font-size:16px!important;border-radius:0}
select option{background:#111}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--fg)}
.full{grid-column:1/-1}
@media(max-width:700px){
  form{grid-template-columns:1fr;gap:20px}
  form .full .btn{width:100%;text-align:center}
}
#msg{margin-top:20px;max-width:900px;color:var(--mut);font-size:14px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>

let _vsTimer=null;
function stopVideoSeq(){if(_vsTimer){clearTimeout(_vsTimer);_vsTimer=null;}}
function initVideoSeq(root){
  stopVideoSeq();
  const vids=[...root.querySelectorAll(".card video")];
  if(!vids.length)return;
  let idx=0;
  function playNext(){
    vids.forEach(v=>{v.pause();v.currentTime=0;});
    const v=vids[idx];
    v.currentTime=0;
    v.play().catch(()=>{});
    idx=(idx+1)%vids.length;
    _vsTimer=setTimeout(playNext,2000);
  }
  playNext();
}
function initCards(root){const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
root.querySelectorAll("canvas[data-f]").forEach(c=>{const sp=FILMS[c.dataset.f],P=Player(c,sp),cd=c.closest(".card");c._p=P;P.seek(sp.po);if(rm)return;
cd.onmouseenter=()=>{P.seek(0);P.play()};cd.onmouseleave=()=>{P.pause();P.seek(sp.po)};P.onend=()=>{P.seek(0);P.play()}});
initVideoSeq(root);}
